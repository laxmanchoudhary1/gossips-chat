<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - Gossips Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm">
        <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-5 text-center">User Profile</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-3 p-2.5 rounded-lg text-xs bg-red-500/20 border border-red-500 text-red-300">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="space-y-4 mb-6">
            <div>
                <span class="block text-xs font-medium text-slate-400 mb-1">Username</span>
                <div class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 font-semibold">{{ user[0] }}</div>
            </div>
            <div>
                <span class="block text-xs font-medium text-slate-400 mb-1">Mobile Number</span>
                <div class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-slate-200 font-mono">{{ user[1] }}</div>
            </div>
        </div>

        <hr class="border-slate-800 mb-5">

        <h3 class="text-sm font-bold text-slate-300 mb-3">Change Password</h3>
        <form method="POST" class="space-y-3.5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Old Password</label>
                <input type="password" name="old_password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">New Password</label>
                <input type="password" name="new_password" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 font-semibold py-2.5 rounded-xl text-sm transition duration-200 shadow-lg shadow-purple-500/25">Update Password</button>
        </form>

        <div class="mt-5 text-center">
            <a href="/chat" class="text-purple-400 hover:underline text-xs">← Back to Chat Room</a>
        </div>
    </div>
</body>
</html>

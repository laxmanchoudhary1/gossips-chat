<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncSphere - Account Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex items-center justify-center p-6 font-sans">
    <div class="bg-slate-900 border border-slate-800 p-8 rounded-3xl w-full max-w-md shadow-2xl space-y-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-purple-500 to-pink-500 flex items-center justify-center shadow-lg">
                    <span class="text-sm font-bold text-white">🪐</span>
                </div>
                <h1 class="text-lg font-bold text-white">Account Settings</h1>
            </div>
            <a href="/chat" class="text-xs text-purple-400 hover:underline">← Back to Chat</a>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-xl text-xs {{ 'bg-emerald-500/20 border border-emerald-500/40 text-emerald-300' if category == 'success' else 'bg-red-500/20 border border-red-500/40 text-red-300' }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-slate-950 border border-slate-800 p-4 rounded-2xl space-y-2 text-xs">
            <div class="text-slate-400">Username: <strong class="text-slate-200">{{ user[0] }}</strong></div>
            <div class="text-slate-400">Mobile: <strong class="text-slate-200">{{ user[1] }}</strong></div>
        </div>

        <!-- Status Form -->
        <form method="POST" class="space-y-3">
            <input type="hidden" name="update_status" value="1">
            <label class="block text-xs font-medium text-slate-400">Update Custom Status</label>
            <select name="status" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-purple-500 text-slate-200">
                <option value="Online 🟢" {{ 'selected' if user[2] == 'Online 🟢' else '' }}>Online 🟢</option>
                <option value="Busy 🔴" {{ 'selected' if user[2] == 'Busy 🔴' else '' }}>Busy 🔴</option>
                <option value="Away 🌙" {{ 'selected' if user[2] == 'Away 🌙' else '' }}>Away 🌙</option>
                <option value="Coding 💻" {{ 'selected' if user[2] == 'Coding 💻' else '' }}>Coding 💻</option>
            </select>
            <button type="submit" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold py-2.5 rounded-xl text-xs transition">Save Status</button>
        </form>

        <hr class="border-slate-800">

        <!-- Password Form -->
        <form method="POST" class="space-y-3.5">
            <h3 class="text-xs font-bold text-purple-400 uppercase tracking-wider">Change Password</h3>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Old Password</label>
                <input type="password" name="old_password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">New Password</label>
                <input type="password" name="new_password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-purple-500/20">Update Password</button>
        </form>
    </div>
</body>
</html>

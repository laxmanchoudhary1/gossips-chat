<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Gossips Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen px-4">
    <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-sm">
        <h2 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-5 text-center">Create Account</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="mb-3 p-2.5 rounded-lg text-xs bg-red-500/20 border border-red-500 text-red-300">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-3.5">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                <input type="text" name="username" required placeholder="Choose unique username" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Mobile Number (10 digits)</label>
                <input type="tel" name="mobile" required pattern="[0-9]{10}" maxlength="10" placeholder="e.g. 9876543210" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                <input type="password" name="password" required placeholder="Create password" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-purple-500 text-slate-100">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-purple-500 to-pink-500 hover:opacity-90 font-semibold py-2.5 rounded-xl text-sm transition duration-200 shadow-lg shadow-purple-500/25">Sign Up</button>
        </form>
        <p class="mt-5 text-center text-slate-400 text-xs">Already have an account? <a href="/login" class="text-purple-400 hover:underline">Sign In</a></p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Chat - Gossips</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden flex flex-col">

    <!-- TOP HEADER WITH SIGN IN / ACCOUNT BUTTON -->
    <header class="flex items-center justify-between px-6 py-4 bg-slate-900 border-b border-slate-800 z-40">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center shadow-lg shadow-indigo-600/30">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            </div>
            <h1 class="text-base font-bold tracking-tight">Gossips Chat</h1>
        </div>
        <div class="flex items-center space-x-3">
            <button id="top-auth-btn" onclick="openAuthModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md transition-all">
                🔐 Sign In / Sign Up
            </button>
            <div id="user-profile-badge" class="hidden items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700">
                <span class="text-xs font-medium text-indigo-400" id="badge-name">User</span>
                <button onclick="logoutUser()" class="text-xs text-red-400 hover:text-red-300 ml-2">Logout</button>
            </div>
        </div>
    </header>

    <!-- AUTHENTICATION MODAL (POPUP FOR NUMBER, NAME, PASSWORD) -->
    <div id="auth-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <h2 class="text-xl font-bold">Welcome to Gossips</h2>
                <p class="text-xs text-slate-400 mt-1">Enter your phone number to Sign In or Sign Up</p>
            </div>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number (Account ID)</label>
                    <input type="tel" id="modal-phone" required placeholder="9876543210" class="w-full bg-slate-950 text-slate-100 placeholder-slate-600 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Your Name</label>
                    <input type="text" id="modal-name" required placeholder="Aryan" class="w-full bg-slate-950 text-slate-100 placeholder-slate-600 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                    <input type="password" id="modal-pass" required placeholder="••••••••" class="w-full bg-slate-950 text-slate-100 placeholder-slate-600 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-medium text-sm transition-all shadow-lg shadow-indigo-600/25">
                    Continue & Save Account
                </button>
            </form>
        </div>
    </div>

    <!-- ONBOARDING & GROUP SETUP CONTAINER -->
    <div id="onboarding-container" class="flex-1 flex flex-col justify-center items-center p-4 overflow-y-auto">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl">
            <div class="text-center mb-6">
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">Step 2</span>
                <h2 class="text-xl font-bold mt-2">Group Chat Setup</h2>
                <p class="text-xs text-slate-400">Join or create a group room</p>
            </div>
            <form id="group-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Group Name</label>
                    <input type="text" id="group-name-input" required value="Legends Chat" class="w-full bg-slate-950 text-slate-100 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Group Password</label>
                    <input type="password" id="group-pass-input" required value="password123" class="w-full bg-slate-950 text-slate-100 text-sm rounded-xl px-4 py-3 border border-slate-800 focus:outline-none focus:border-indigo-500">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3.5 rounded-xl font-medium text-sm transition-all shadow-lg shadow-indigo-600/25">
                    Enter Chat Room 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN CHAT APP -->
    <div id="main-chat-app" class="hidden flex-1 flex flex-row w-full overflow-hidden">
        <aside class="w-80 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <h2 class="font-bold text-sm text-slate-100" id="sidebar-group-name">Legends Chat</h2>
            </div>
            <div class="p-3 m-3 rounded-2xl bg-slate-950 border border-indigo-500/30 flex items-center space-x-3">
                <span class="text-xl">🤖</span>
                <div>
                    <h4 class="text-xs font-bold text-slate-200">Smart AI Bot</h4>
                    <p class="text-[11px] text-slate-400">Ready to help!</p>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-full bg-slate-950">
            <header class="flex items-center justify-between px-6 py-3.5 bg-slate-900 border-b border-slate-800">
                <h2 class="font-bold text-sm text-slate-100" id="header-username">Chat Room</h2>
            </header>

            <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="flex justify-start">
                    <div class="max-w-[70%] rounded-2xl p-4 bg-slate-900 text-slate-200 border border-slate-800">
                        <p class="text-sm">Welcome to the group! Type your message or ask AI using regular text.</p>
                    </div>
                </div>
            </div>

            <footer class="p-4 bg-slate-900 border-t border-slate-800">
                <form id="chat-form" class="max-w-4xl mx-auto flex items-center gap-3">
                    <input type="text" id="user-input" placeholder="Type a message..." required class="w-full bg-slate-950 text-slate-100 text-sm rounded-xl px-4 py-3.5 border border-slate-800 focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="bg-indigo-600 text-white px-5 py-3.5 rounded-xl font-medium text-sm">Send</button>
                </form>
            </footer>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('gossips_user')) || null;

        function checkAuthState() {
            if (currentUser) {
                document.getElementById('auth-modal').classList.add('hidden');
                document.getElementById('top-auth-btn').classList.add('hidden');
                document.getElementById('user-profile-badge').classList.remove('hidden');
                document.getElementById('badge-name').innerText = currentUser.name;
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('top-auth-btn').classList.remove('hidden');
                document.getElementById('user-profile-badge').classList.add('hidden');
            }
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
        }

        function logoutUser() {
            localStorage.removeItem('gossips_user');
            currentUser = null;
            window.location.reload();
        }

        document.getElementById('auth-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const phone = document.getElementById('modal-phone').value.trim();
            const name = document.getElementById('modal-name').value.trim();
            const pass = document.getElementById('modal-pass').value.trim();

            // Check if account with this phone already exists in localStorage database
            let allAccounts = JSON.parse(localStorage.getItem('gossips_accounts')) || {};
            
            if (allAccounts[phone]) {
                // Account exists, log user in directly
                currentUser = allAccounts[phone];
                alert('Welcome back, ' + currentUser.name + '! Account loaded successfully.');
            } else {
                // Create new account & save
                currentUser = { phone, name, pass };
                allAccounts[phone] = currentUser;
                localStorage.setItem('gossips_accounts', JSON.stringify(allAccounts));
                alert('New account created and saved successfully!');
            }

            localStorage.setItem('gossips_user', JSON.stringify(currentUser));
            checkAuthState();
        });

        document.getElementById('group-form').addEventListener('submit', function(e) {
            e.preventDefault();
            if (!currentUser) {
                alert('Please sign in first!');
                openAuthModal();
                return;
            }
            const groupName = document.getElementById('group-name-input').value.trim();
            
            document.getElementById('onboarding-container').style.display = 'none';
            document.getElementById('main-chat-app').classList.remove('hidden');
            document.getElementById('sidebar-group-name').innerText = groupName;
            document.getElementById('header-username').innerText = currentUser.name + ' (You)';
        });

        const chatContainer = document.getElementById('chat-container');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');

        function appendMessage(sender, text, isUser = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex ${isUser ? 'justify-end' : 'justify-start'}`;
            messageDiv.innerHTML = `
                <div class="max-w-[70%] rounded-2xl p-4 ${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-200 border border-slate-800'}">
                    <p class="text-xs font-bold mb-1">${sender}</p>
                    <p class="text-sm">${text}</p>
                </div>
            `;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(currentUser.name, text, true);
            userInput.value = '';

            try {
                const response = await fetch('http://localhost:5000/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                const data = await response.json();
                appendMessage('Smart AI Bot', data.reply, false);
            } catch (error) {
                appendMessage('System', '⚠️ Error connecting to server.', false);
            }
        });

        // Run on load
        checkAuthState();
    </script>
</body>
</html>
